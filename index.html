<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191919">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="인생네컷">
  <meta name="description" content="오프라인에서도 실행되는 인생네컷 PWA">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png">
  <link rel="stylesheet" href="./style.css">
  <title>인생네컷</title>
  <script src="./version.js"></script>
  <script src="./title.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="pick-screen" hidden><div id="pick-title"></div><p>누구와 찍을까요?</p><button id="pick-with" type="button">목사님과 함께 찍기</button><button id="pick-solo" type="button">혼자 찍기</button></div>
  <main class="app">
    <header class="topbar"><span class="brand">인생네컷</span><button id="btn-home" type="button" hidden>처음으로</button><span id="network" class="status" role="status" aria-live="polite">상태 확인 중</span></header>
    <section class="content" aria-labelledby="heading">
      <div class="preview" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
      <div class="camera-panel">
        <div class="camera-stage">
          <div id="preview-wrap"><video id="preview" autoplay muted playsinline webkit-playsinline aria-label="실시간 카메라 미리보기"></video><canvas id="guide" width="1000" height="750" aria-hidden="true"></canvas></div>
          <div id="countdown" class="countdown" aria-live="off" hidden></div>
          <div id="flash" class="flash" aria-hidden="true"></div>
        </div>
        <div class="guide-controls"><label><input id="guide-toggle" type="checkbox" checked> 가이드</label><label>투명도 <input id="guide-opacity" type="range" min="0.2" max="0.9" step="0.05" value="0.55"></label></div><div id="frame-picker" class="frame-picker" aria-label="촬영 프레임 선택"></div><div class="camera-controls">
          <button id="start-camera" type="button">카메라 시작</button>
          <button id="switch-camera" type="button" hidden>전환</button>
        </div>
        <div class="shoot-controls">
          <button id="shoot-start" type="button" disabled>촬영 시작</button>
          <button id="shoot-cancel" type="button" hidden>취소</button>
          <button id="shoot-retry" type="button" hidden>다시 찍기</button>
        </div>
        <p id="shot-progress" aria-live="polite" hidden></p>
        <p id="status" role="status" aria-live="polite">카메라 시작 버튼을 눌러주세요.</p>
      </div>
      <h1 id="heading">인생네컷</h1>
      <p>버튼을 누르면 10초 간격으로 4컷이 자동으로 찍혀요</p>
      <p id="mode" class="mode" aria-live="polite"></p>
      <button id="test-button" type="button">작동 확인</button>
      <p id="feedback" aria-live="polite"></p>
    </section>
    <section id="shot-results" class="shot-results" aria-label="촬영 결과" hidden>
      <h2>촬영된 사진 4컷</h2>
      <div id="shot-thumbnails" class="shot-thumbnails"></div>
    </section>
    <section id="composition" class="composition" aria-label="합성 결과" hidden>
      <h2>인생네컷 완성본</h2>
      <div class="save-toolbar">
        <button id="save-result" type="button" disabled>준비 중...</button>
        <small>저장하기를 누르면 사진이 크게 나타나요</small>
      </div>
      <div id="save-fallback" class="save-fallback" hidden>
        <p>① 사진을 꾹 누르세요 (1초)  ② '사진에 추가'를 눌러요</p>
        <img id="save-fallback-image" alt="완성된 인생네컷 이미지">
      </div>
      <div class="frame-select" aria-label="프레임 선택"></div>
      <p id="compose-status" role="status" aria-live="polite"></p>
      <div class="composition-scroll">
        <canvas id="result-canvas" width="1200" height="3600" aria-label="합성된 네 컷 사진"></canvas>
      </div>
    </section>
    <footer>© 인생네컷 · PWA Starter</footer>
  </main>
  <div id="version-indicator"><div class="refresh-control"><button id="btn-refresh" type="button" aria-label="새로고침 및 업데이트 확인" title="탭: 업데이트 확인 / 길게: 완전 초기화">↻</button><small>탭: 업데이트 확인 / 길게: 완전 초기화</small></div><div id="ver"></div><button id="update-app" type="button" hidden>새 버전 있음 · 탭해서 적용</button></div>
  <div id="global-error" role="alert" hidden title="탭하여 닫기"></div>
</body>
</html>
